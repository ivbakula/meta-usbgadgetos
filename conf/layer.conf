# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-usbgadgetos"
BBFILE_PATTERN_meta-usbgadgetos = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-usbgadgetos = "6"

LAYERDEPENDS_meta-usbgadgetos = "core"
LAYERSERIES_COMPAT_meta-usbgadgetos = "whinlatter"
